<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melete</title>
    <style>
      /* The host broadcasts its live design tokens over postMessage and the SDK
         writes them onto <html>. These fallbacks are what the cartridge looks
         like in the half-second before that arrives, and when it is opened
         standalone in a browser during development. */
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--bg-void, #0e0d13);
        color: var(--text-primary, #ece9f5);
        font-family: var(--font-sans, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif);
        overflow: hidden;
      }
      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb {
        background: var(--border-subtle, #2a2735);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
